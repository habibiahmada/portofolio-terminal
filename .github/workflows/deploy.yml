name: Deploy SSH Server

# Deploys the Wish SSH portfolio server to EC2.
#
# Required repository secrets:
#   EC2_HOST              — public IP or hostname
#   EC2_USER              — SSH user (e.g. ubuntu)
#   EC2_SSH_KEY           — private key (public key in ~/.ssh/authorized_keys)
#   EC2_PORT              — optional admin SSH port (default 2223; Wish listens on :22)
#   EC2_INSTANCE_ID       — AWS instance id (for state check)
#   AWS_ACCESS_KEY_ID     — IAM key with ec2:DescribeInstances
#   AWS_SECRET_ACCESS_KEY — matching secret
#
# Triggers:
#   - push to main or tag v* (deploy when EC2 is running)
#   - workflow_dispatch
#   - schedule 07:05 / 13:05 / 20:05 WIB — catch-up if main moved while EC2 was off
#
# If EC2 is stopped, the workflow exits successfully and defers to the next window.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    # 07:05, 13:05, 20:05 WIB (UTC+7) → 00:05, 06:05, 13:05 UTC
    - cron: "5 0,6,13 * * *"

concurrency:
  group: deploy-ssh-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Check EC2 secrets
        id: ec2_secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ] && [ -n "$EC2_INSTANCE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=EC2 deploy skipped::Set EC2_HOST, EC2_USER, EC2_SSH_KEY, and EC2_INSTANCE_ID to enable SSH deploy."
          fi

      - name: Check EC2 instance state
        id: ec2
        if: steps.ec2_secrets.outputs.configured == 'true'
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "Instance ${INSTANCE_ID} is ${STATE}"

      - name: Stop — EC2 is not running
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state != 'running'
        run: |
          cat <<EOF
          EC2 is not running (${{ steps.ec2.outputs.state }}).
          Deploy deferred until the instance is started.
          Next automatic catch-up: scheduled at 07:05, 13:05, or 20:05 WIB.
          EOF

      - name: Resolve deploy target commit
        id: target
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git fetch origin main
            SHA="$(git rev-parse origin/main)"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploy target commit: ${SHA}"

      - name: Prepare SSH key
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

      - name: Check pending deploy (scheduled catch-up)
        id: pending
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && github.event_name == 'schedule'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '2223' }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          DEPLOYED="$(ssh -i ~/.ssh/ec2.pem \
            -p "$EC2_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -o BatchMode=yes \
            "${EC2_USER}@${EC2_HOST}" \
            'cat /opt/habibiahmada/.deployed-sha 2>/dev/null || echo none')"
          echo "Deployed on EC2: ${DEPLOYED}"
          echo "Target on main:  ${TARGET_SHA}"
          if [ "$DEPLOYED" = "$TARGET_SHA" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No pending deploy — production is up to date."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Pending deploy detected — continuing."
          fi

      - name: Skip — no pending deploy
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && github.event_name == 'schedule' && steps.pending.outputs.needed == 'false'
        run: echo "Scheduled run finished — nothing to deploy."

      - name: Set up Go
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && (github.event_name != 'schedule' || steps.pending.outputs.needed == 'true')
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run tests
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && (github.event_name != 'schedule' || steps.pending.outputs.needed == 'true')
        run: go test ./...

      - name: Run vet
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && (github.event_name != 'schedule' || steps.pending.outputs.needed == 'true')
        run: go vet ./...

      - name: Build SSH server binary
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && (github.event_name != 'schedule' || steps.pending.outputs.needed == 'true')
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o habibiahmada-ssh ./cmd/ssh
          ls -lh habibiahmada-ssh

      - name: Provision deploy directory on EC2
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && (github.event_name != 'schedule' || steps.pending.outputs.needed == 'true')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '2223' }}
          script: |
            sudo mkdir -p /opt/habibiahmada
            sudo chown "$USER":"$USER" /opt/habibiahmada

      - name: Copy artifacts to EC2
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && (github.event_name != 'schedule' || steps.pending.outputs.needed == 'true')
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '2223' }}
          source: "habibiahmada-ssh,deploy/portfolio-ssh.service"
          target: "/opt/habibiahmada/"
          strip_components: 0

      - name: Deploy & restart service on EC2
        if: steps.ec2_secrets.outputs.configured == 'true' && steps.ec2.outputs.state == 'running' && (github.event_name != 'schedule' || steps.pending.outputs.needed == 'true')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '2223' }}
          script: |
            set -e
            cd /opt/habibiahmada

            mkdir -p .ssh
            chmod 755 habibiahmada-ssh

            if [ ! -f .ssh/term_info_ed25519 ]; then
              echo "Generating Wish SSH host key"
              ssh-keygen -t ed25519 -f .ssh/term_info_ed25519 -N "" -C "wish-portfolio@habibiahmada.dev"
              chmod 600 .ssh/term_info_ed25519*
            fi
            cp -f .ssh/term_info_ed25519 /opt/habibiahmada/term_info_ed25519
            cp -f .ssh/term_info_ed25519.pub /opt/habibiahmada/term_info_ed25519.pub
            chmod 600 /opt/habibiahmada/term_info_ed25519 /opt/habibiahmada/term_info_ed25519.pub

            sudo cp deploy/portfolio-ssh.service /etc/systemd/system/portfolio-ssh.service
            sudo systemctl daemon-reload
            sudo systemctl enable portfolio-ssh.service || true
            sudo systemctl restart portfolio-ssh.service

            sleep 2
            sudo systemctl --no-pager --lines=20 status portfolio-ssh.service || true

            if sudo ss -ltnp | grep -q ':22 '; then
              echo "OK: SSH portfolio listening on :22"
            else
              echo "ERROR: port 22 not detected — check systemd logs" >&2
              exit 1
            fi

            echo "${{ steps.target.outputs.sha }}" > /opt/habibiahmada/.deployed-sha
            echo "Recorded deployed commit: $(cat /opt/habibiahmada/.deployed-sha)"
